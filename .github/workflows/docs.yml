name: Deploy docs site

# Builds the VitePress site in site/ and publishes it to GitHub Pages.
# Enable once in the repo: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

on:
  push:
    branches: [main, Nautilus]
    paths:
      - "site/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build site
        env:
          # GitHub Pages serves a project site under /<repo>/.
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: bun run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
