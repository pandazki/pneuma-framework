<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Bookmarks (core-domain)</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f9f6ef;
      --fg: #2a2d2e;
      --accent: #6b8ba8;
      --accent-strong: #4a6f8f;
      --muted: #a8a29e;
      --card: #fffdf7;
      --border: #c8c3b8;
      --danger: #c17a5c;
      --sage: #8a9a7f;
      --terracotta: #c17a5c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1f1d;
        --fg: #e8e4dc;
        --card: #2a2a28;
        --border: #3f3f3a;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 2rem 1.2rem;
      line-height: 1.55;
    }
    main { max-width: 820px; margin: 0 auto; }
    h1 { font-weight: 600; font-size: 1.7rem; margin: 0 0 0.2rem; }
    h2 { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 0.6rem; color: var(--accent); }
    p.subtitle { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.2rem;
      margin: 0.7rem 0;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.2rem; }
    input, button, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }
    input, textarea {
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--fg);
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
    }
    textarea { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.85rem; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 0.5rem;
    }
    button:hover { background: var(--accent-strong); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.danger { background: var(--danger); }
    button.inline { margin: 0; padding: 0.3rem 0.8rem; font-size: 0.8rem; }
    .row { display: flex; gap: 0.6rem; align-items: baseline; }
    .bookmark {
      border-left: 3px solid var(--sage);
      padding: 0.5rem 0 0.5rem 1rem;
      margin: 1rem 0;
    }
    .bookmark-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 0.8rem;
      margin-bottom: 0.5rem;
    }
    .bookmark-title { font-weight: 500; font-size: 1rem; margin: 0; }
    .bookmark-url { font-size: 0.8rem; color: var(--accent); text-decoration: none; word-break: break-all; }
    .bookmark-url:hover { text-decoration: underline; }
    .bookmark-meta { font-size: 0.75rem; color: var(--muted); }
    .interp {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem 0.7rem;
      margin: 0.4rem 0;
      background: var(--bg);
    }
    .interp-lens {
      font-size: 0.8rem;
      color: var(--terracotta);
      font-weight: 500;
      margin-bottom: 0.3rem;
    }
    .interp-body {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.82rem;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .lens {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem 0.8rem;
      margin: 0.3rem 0;
    }
    .lens-name { font-weight: 500; margin: 0 0 0.1rem; }
    .lens-prompt {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      white-space: pre-wrap;
    }
    .error {
      background: rgba(193, 122, 92, 0.12);
      border-left: 3px solid var(--danger);
      padding: 0.6rem 0.8rem;
      margin: 0.6rem 0;
      font-size: 0.9rem;
      border-radius: 0 4px 4px 0;
    }
    .spinner::after { content: "…"; animation: dots 1.4s steps(4) infinite; }
    @keyframes dots {
      0%, 20% { content: ""; }
      40% { content: "."; }
      60% { content: ".."; }
      80%, 100% { content: "..."; }
    }
    .related-panel {
      margin-top: 1rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }
    .related-panel h4 {
      margin: 0 0 0.25rem;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .related-panel ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .related-panel li {
      font-size: 0.9rem;
      padding: 0.15rem 0;
    }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>AI Bookmarks</h1>
    <p class="subtitle">存 URL → Jina Reader 抓正文 → 每个 lens 用 Sonnet 4.6 解读 → 入库. Transform cache 保证同 url+同 lens 不重烧 LLM.</p>

    <div class="card">
      <h2 style="margin-top:0">Add bookmark</h2>
      <label for="url">URL</label>
      <input id="url" type="url" placeholder="https://example.com/article">
      <div class="row" style="margin-top:0.5rem">
        <button id="add-btn" type="button">Add & interpret</button>
        <span id="add-status" class="spinner" style="color:var(--muted);font-size:0.9rem"></span>
      </div>
    </div>

    <div id="error-area"></div>

    <h2>Bookmarks</h2>
    <div id="bookmarks-container">
      <p style="color:var(--muted);font-style:italic">Loading…</p>
    </div>

    <h2>Lenses</h2>
    <div class="card">
      <p style="font-size:0.85rem;color:var(--muted);margin-top:0">
        每个 lens 是一段 system prompt. 加 bookmark 时每个 lens 都会被用来生成一份独立解读.
      </p>
      <div id="lenses-container">
        <p style="color:var(--muted);font-style:italic">Loading…</p>
      </div>
      <details style="margin-top:1rem">
        <summary style="cursor:pointer;color:var(--accent)">+ Add / update lens</summary>
        <div style="margin-top:0.8rem">
          <label for="lens-slug">Slug (唯一 id)</label>
          <input id="lens-slug" type="text" placeholder="my-lens-name">
          <label for="lens-display" style="margin-top:0.6rem">Display name</label>
          <input id="lens-display" type="text" placeholder="My Lens · 我的视角">
          <label for="lens-prompt" style="margin-top:0.6rem">Prompt</label>
          <textarea id="lens-prompt" rows="4" placeholder="You are ..."></textarea>
          <div><button id="upsert-lens-btn" class="inline" type="button" style="margin-top:0.5rem">Save</button></div>
        </div>
      </details>
    </div>

    <h2>Raw API</h2>
    <details>
      <summary style="cursor:pointer;color:var(--muted)">Try with curl</summary>
      <pre id="curl-snippets" style="font-size:0.8rem;padding:0.7rem;background:var(--card);border:1px solid var(--border);border-radius:4px;overflow-x:auto"></pre>
    </details>
  </main>

<script>
(() => {
  const api = (p, opts) => fetch(`/api/operations/${p}`, opts).then(async (r) => {
    const text = await r.text();
    let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
    return { ok: r.ok, status: r.status, data };
  });

  const errorArea = document.getElementById("error-area");
  function showError(msg) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = msg;
    errorArea.appendChild(div);
    setTimeout(() => div.remove(), 8000);
  }
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  async function loadRelated(bookmarkId) {
    try {
      const { ok, data } = await api("related_bookmarks", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ input: { bookmark_id: bookmarkId, limit: 5 } }),
      });
      if (!ok) return [];
      return data.output?.rows ?? data.rows ?? [];
    } catch {
      return [];
    }
  }

  function renderRelated(container, rows) {
    if (!rows.length) {
      container.innerHTML = "<div class='muted'>No related bookmarks yet.</div>";
      return;
    }
    container.innerHTML =
      "<h4>Related</h4><ul>" +
      rows
        .map(
          (r) =>
            `<li><a href="#bm-${escapeHtml(r.bookmark_id)}">${escapeHtml(r.title ?? r.url ?? r.bookmark_id)}</a>` +
            ` <span class="muted">(${(typeof r.score === "number" ? r.score : 0).toFixed(3)})</span></li>`
        )
        .join("") +
      "</ul>";
  }

  async function refreshLenses() {
    const { ok, data } = await api("list_lenses");
    const c = document.getElementById("lenses-container");
    if (!ok) { showError("list_lenses failed"); return; }
    const rows = data.rows || [];
    if (rows.length === 0) {
      c.innerHTML = '<p style="color:var(--muted);font-style:italic">No lenses configured.</p>';
      return;
    }
    c.innerHTML = rows.map((l) => `
      <div class="lens">
        <div style="display:flex;justify-content:space-between;gap:0.6rem;align-items:start">
          <div style="flex:1;min-width:0">
            <div class="lens-name">${escapeHtml(l.display_name)} <code style="font-size:0.75rem;color:var(--muted)">${escapeHtml(l.slug)}</code></div>
            <div class="lens-prompt">${escapeHtml(l.prompt)}</div>
          </div>
          <button class="danger inline" data-lens-id="${l.id}">Delete</button>
        </div>
      </div>
    `).join("");
    for (const btn of c.querySelectorAll("button[data-lens-id]")) {
      btn.addEventListener("click", () => deleteLens(btn.dataset.lensId));
    }
  }

  async function deleteLens(id) {
    // step 1: probe without confirmed
    const first = await api("delete_lens", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ input: { lens_id: { kind: "row", table: "lenses", id } } }),
    });
    if (first.status === 428) {
      if (!window.confirm(first.data.impact?.disclosure || "Delete this lens?")) return;
    } else if (!first.ok) {
      showError("delete_lens: " + (first.data.message || first.data.error));
      return;
    } else {
      return refreshAll();
    }
    const second = await api("delete_lens", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ input: { lens_id: { kind: "row", table: "lenses", id } }, confirmed: true }),
    });
    if (!second.ok) {
      showError("delete_lens: " + (second.data.message || second.data.error));
      return;
    }
    refreshAll();
  }

  async function upsertLens() {
    const slug = document.getElementById("lens-slug").value.trim();
    const display = document.getElementById("lens-display").value.trim();
    const prompt = document.getElementById("lens-prompt").value.trim();
    if (!slug || !display || !prompt) { showError("all three fields required"); return; }
    const r = await api("upsert_lens", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ input: { slug, display_name: display, prompt } }),
    });
    if (!r.ok) { showError("upsert_lens: " + (r.data.message || r.data.error)); return; }
    document.getElementById("lens-slug").value = "";
    document.getElementById("lens-display").value = "";
    document.getElementById("lens-prompt").value = "";
    refreshAll();
  }

  async function refreshBookmarks() {
    const c = document.getElementById("bookmarks-container");
    const { ok, data } = await api("list_bookmarks");
    if (!ok) { showError("list_bookmarks failed"); return; }
    const bookmarks = data.rows || [];
    if (bookmarks.length === 0) {
      c.innerHTML = '<p style="color:var(--muted);font-style:italic">No bookmarks yet.</p>';
      return;
    }
    // For each bookmark, fetch its interpretations too
    const htmlFrags = [];
    for (const b of bookmarks) {
      const interps = await api("list_bookmark_interpretations?bookmark_id=" + encodeURIComponent(b.id));
      const irows = interps.ok ? (interps.data.rows || []) : [];
      const addedAt = new Date(b.created_at).toLocaleString();
      htmlFrags.push(`
        <div class="bookmark" id="bm-${escapeHtml(b.id)}">
          <div class="bookmark-header">
            <div style="flex:1;min-width:0">
              <p class="bookmark-title">${escapeHtml(b.title || "(untitled)")}</p>
              <a class="bookmark-url" href="${escapeHtml(b.url)}" target="_blank" rel="noopener">${escapeHtml(b.url)}</a>
              <div class="bookmark-meta">${addedAt} · ${irows.length} interpretations</div>
            </div>
            <button class="danger inline" data-bm-id="${b.id}">Delete</button>
          </div>
          ${irows.map((i) => `
            <div class="interp">
              <div class="interp-lens">lens: ${escapeHtml(i.lens_id?.id ?? "?")}</div>
              <div class="interp-body">${escapeHtml(i.body)}</div>
            </div>
          `).join("")}
          <div class="related-panel" data-related-for="${escapeHtml(b.id)}"></div>
        </div>
      `);
    }
    c.innerHTML = htmlFrags.join("");
    for (const btn of c.querySelectorAll("button[data-bm-id]")) {
      btn.addEventListener("click", () => deleteBookmark(btn.dataset.bmId));
    }
    // Populate Related panels asynchronously after DOM is set
    for (const b of bookmarks) {
      const relatedEl = c.querySelector(`.related-panel[data-related-for="${CSS.escape(b.id)}"]`);
      if (relatedEl) {
        loadRelated(b.id).then((rows) => renderRelated(relatedEl, rows));
      }
    }
  }

  async function deleteBookmark(id) {
    const first = await api("delete_bookmark", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ input: { bookmark_id: { kind: "row", table: "bookmarks", id } } }),
    });
    if (first.status === 428) {
      if (!window.confirm(first.data.impact?.disclosure || "Delete?")) return;
    } else if (!first.ok) {
      showError("delete: " + (first.data.message || first.data.error));
      return;
    } else {
      return refreshAll();
    }
    const second = await api("delete_bookmark", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ input: { bookmark_id: { kind: "row", table: "bookmarks", id } }, confirmed: true }),
    });
    if (!second.ok) {
      showError("delete: " + (second.data.message || second.data.error));
      return;
    }
    refreshAll();
  }

  async function addBookmark() {
    const url = document.getElementById("url").value.trim();
    if (!url) { showError("url required"); return; }
    const btn = document.getElementById("add-btn");
    const status = document.getElementById("add-status");
    btn.disabled = true;
    status.textContent = "Fetching + interpreting";
    try {
      const { ok, data } = await api("add_bookmark", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ input: { url } }),
      });
      if (!ok) throw new Error(data.message || data.error || "add failed");
      document.getElementById("url").value = "";
      refreshAll();
    } catch (e) {
      showError("Add failed: " + (e.message || e));
    } finally {
      btn.disabled = false;
      status.textContent = "";
    }
  }

  async function refreshAll() {
    await Promise.all([refreshBookmarks(), refreshLenses()]);
  }

  document.getElementById("add-btn").addEventListener("click", addBookmark);
  document.getElementById("upsert-lens-btn").addEventListener("click", upsertLens);
  document.getElementById("url").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addBookmark();
  });

  document.getElementById("curl-snippets").textContent = [
    `# list lenses`,
    `curl ${location.origin}/api/operations/list_lenses`,
    ``,
    `# add bookmark (fetches + interprets synchronously, may take 10-30s)`,
    `curl -X POST ${location.origin}/api/operations/add_bookmark \\`,
    `  -H 'content-type: application/json' \\`,
    `  -d '{"input":{"url":"https://bun.sh/blog"}}'`,
    ``,
    `# list bookmarks`,
    `curl ${location.origin}/api/operations/list_bookmarks`,
    ``,
    `# interpretations for one bookmark`,
    `curl '${location.origin}/api/operations/list_bookmark_interpretations?bookmark_id=bm-xxx'`,
    ``,
    `# audit`,
    `curl '${location.origin}/api/events?limit=20'`,
  ].join("\n");

  refreshAll();
})();
</script>
</body>
</html>
