<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">M54 端到端治理回路</title>
  <desc id="desc">一条治理回路：从一句原话到回退 在治理模式下，没有批准记录就没有变更；每次尝试都连同成立的保证一起记下。</desc>
  <defs>
    <style>
      .serif { font-family: 'Iowan Old Style', 'Songti SC', 'Noto Serif CJK SC', serif; }
      .sans { font-family: 'Avenir Next', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#1F1B16" stroke-width="1.3"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#B8732A" stroke-width="1.4"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="1600.0" height="900.0" fill="#F4EFE3"/>
  <text x="72.0" y="98.0" class="serif" font-size="42" fill="#1F1B16">一条治理回路：从一句原话到回退</text>
  <text x="72.0" y="138.0" class="sans" font-size="19" fill="#1F1B16" fill-opacity="0.72">在治理模式下，没有批准记录就没有变更；每次尝试都连同成立的保证一起记下。</text>
  <line x1="72.0" y1="166.0" x2="1528.0" y2="166.0" stroke="#1F1B16" stroke-width="0.8" stroke-opacity="0.35" />
  <line x1="72.0" y1="846.0" x2="1528.0" y2="846.0" stroke="#1F1B16" stroke-width="0.8" stroke-opacity="0.35" />
  <text x="72.0" y="876.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.6">Pneuma · Milestone 54 快照 · 2026-11-24</text>
  <text x="1528.0" y="876.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.75" text-anchor="end">owner 决定</text>
  <circle cx="1435.2" cy="871.0" r="5.5" fill="#B8732A"/>
  <text x="72.0" y="234.0" class="sans" font-size="15" font-weight="600" letter-spacing="0.6" fill="#1F1B16" fill-opacity="0.6">原话</text>
  <text x="72.0" y="270.0" class="serif" font-size="22" fill="#1F1B16">“加一个搜索框”</text>
  <line x1="240.9" y1="262.0" x2="337.0" y2="262.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="383.0" y1="262.0" x2="627.0" y2="262.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="673.0" y1="262.0" x2="917.0" y2="262.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="963.0" y1="262.0" x2="1207.0" y2="262.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 1253 262 L 1360 262 A 152.0 152.0 0 0 1 1360 566 L 1253 566" fill="none" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="917.0" y1="566.0" x2="673.0" y2="566.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="627.0" y1="566.0" x2="383.0" y2="566.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 1208 566 C 1158 566, 1155.5 526, 1085.5 526 S 1003 566, 963 566" fill="none" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 1208 566 C 1158 566, 1155.5 606, 1085.5 606 S 1003 566, 963 566" fill="none" stroke="#B8732A" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="1085.5" y="516.0" class="sans" font-size="15" font-weight="500" fill="#1F1B16" fill-opacity="0.75" text-anchor="middle">policy:auto</text>
  <path d="M 1085.5 598 L 1093.5 606 L 1085.5 614 L 1077.5 606 Z" fill="#B8732A" stroke="#B8732A" stroke-width="1.6" />
  <text x="1085.5" y="590.0" class="sans" font-size="16" font-weight="600" fill="#B8732A" text-anchor="middle">owner</text>
  <line x1="940.0" y1="240.0" x2="940.0" y2="200.0" stroke="#1F1B16" stroke-width="1" />
  <line x1="935.0" y1="195.0" x2="945.0" y2="205.0" stroke="#1F1B16" stroke-width="1.3" />
  <line x1="935.0" y1="205.0" x2="945.0" y2="195.0" stroke="#1F1B16" stroke-width="1.3" />
  <text x="956.0" y="204.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.75">超出可写目录或碰了受保护路径：</text>
  <text x="956.0" y="224.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.75">拒绝，什么都不发布</text>
  <path d="M 360 543 C 360 484, 650 484, 650 542" fill="none" stroke="#1F1B16" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="505.0" y="474.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.7" text-anchor="middle">计划 → 各项拒绝 → 旧代码上线 → 数据放回 → 探测 → 记录移动</text>
  <circle cx="360.0" cy="262.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="360.0" y="268.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">1</text>
  <text x="360.0" y="318.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">就地编辑</text>
  <text x="360.0" y="346.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">agent 就地编辑 apps/&lt;name&gt;/。</text>
  <text x="360.0" y="368.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.62" text-anchor="middle">Host 驱动：drive change</text>
  <text x="360.0" y="390.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.62" text-anchor="middle">在草稿上运行 agent。</text>
  <circle cx="650.0" cy="262.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="650.0" y="268.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">2</text>
  <text x="650.0" y="318.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">提交</text>
  <text x="650.0" y="346.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">Host 拷贝工作目录，</text>
  <text x="650.0" y="368.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">与地址上正在服务的版本做 diff。</text>
  <circle cx="940.0" cy="262.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="940.0" y="268.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">3</text>
  <text x="940.0" y="318.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">检查</text>
  <text x="940.0" y="346.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">可写目录 · 受保护路径 ·</text>
  <text x="940.0" y="368.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">在应用目录之外的副本里</text>
  <text x="940.0" y="390.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">跑 npm test；草稿按哈希封存。</text>
  <circle cx="1230.0" cy="262.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="1230.0" y="268.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">4</text>
  <text x="1230.0" y="318.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">预览</text>
  <text x="1230.0" y="346.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">临时应用 &lt;app&gt;-pv…，</text>
  <text x="1230.0" y="368.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">自带空存储，到期自己结束</text>
  <text x="1230.0" y="390.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">（默认 3600 s）。</text>
  <circle cx="1230.0" cy="566.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="1230.0" y="572.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">5</text>
  <text x="1230.0" y="622.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">由预设决定</text>
  <text x="1230.0" y="650.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">policy:auto 批准普通变更；</text>
  <text x="1230.0" y="672.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">有风险的由 owner 决定，</text>
  <text x="1230.0" y="694.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">在页面或终端。</text>
  <text x="1230.0" y="716.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">单向变更：针对存储数据的</text>
  <text x="1230.0" y="738.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">第二次确认。</text>
  <circle cx="940.0" cy="566.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="940.0" y="572.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">6</text>
  <text x="940.0" y="622.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">发布</text>
  <text x="940.0" y="650.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">作为受管应用发布到 PneumaSpace；</text>
  <text x="940.0" y="672.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">探测地址。</text>
  <text x="940.0" y="694.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.62" text-anchor="middle">单向变更且声明了能力：</text>
  <text x="940.0" y="716.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.62" text-anchor="middle">先取数据快照。</text>
  <circle cx="650.0" cy="566.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="650.0" y="572.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">7</text>
  <text x="650.0" y="622.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">记录条目</text>
  <text x="650.0" y="650.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">vN、原话、agent、单向标记，</text>
  <text x="650.0" y="672.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">以及成立的保证：</text>
  <text x="650.0" y="694.0" class="sans" font-size="16" font-weight="500" fill="#1F1B16" text-anchor="middle">verified · previewed ·</text>
  <text x="650.0" y="716.0" class="sans" font-size="16" font-weight="500" fill="#1F1B16" text-anchor="middle">approved · sealed</text>
  <circle cx="360.0" cy="566.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="360.0" y="572.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">8</text>
  <text x="360.0" y="622.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">撤销</text>
  <text x="360.0" y="654.0" class="sans" font-size="16" font-weight="600" fill="#1F1B16" text-anchor="middle">代码</text>
  <text x="360.0" y="676.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">总能回去</text>
  <text x="360.0" y="702.0" class="sans" font-size="16" font-weight="600" fill="#1F1B16" text-anchor="middle">存储的数据</text>
  <text x="360.0" y="724.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">只能经 Host 声明的能力恢复</text>
  <text x="360.0" y="750.0" class="sans" font-size="16" font-weight="600" fill="#B8732A" text-anchor="middle">越过单向变更</text>
  <text x="360.0" y="772.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">必须有 owner 确认</text>
</svg>
