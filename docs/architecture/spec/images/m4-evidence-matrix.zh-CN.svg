<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="608" viewBox="0 0 1088 608" role="img" aria-labelledby="title desc">
  <title id="title">M4 证据矩阵</title>
  <desc id="desc">Knowledge Inbox 在 app workflow、operation API、SQLite persistence、Docker restart、browser view 和 demo runner 上的证据覆盖。</desc>
  <defs>
