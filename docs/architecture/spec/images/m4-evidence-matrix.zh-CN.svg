      .yes { fill: #dfe9d7; stroke: #6f8063; stroke-width: 1.1; }
      .partial { fill: #f2d7ac; stroke: #b8732a; stroke-width: 1.1; }
      .serif { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-weight: 400; }
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .title { font-size: 46px; letter-spacing: 0; } .label { font-size: 15px; font-weight: 700; } .small { font-size: 13px; } .mark { font-size: 18px; font-weight: 700; }
    </style>
  </defs>
  <rect class="paper" width="1088" height="608"/>
  <text x="44" y="72" class="serif title ink">证据矩阵</text>
