<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">M54 system architecture</title>
  <desc id="desc">Two control planes and three layers meet in one place: the app directory It carries the protocol, the record and the Host's address, so any agent or any Host can continue it.</desc>
  <defs>
    <style>
      .serif { font-family: 'Iowan Old Style', 'Palatino', Georgia, serif; }
      .sans { font-family: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif; }
    </style>
