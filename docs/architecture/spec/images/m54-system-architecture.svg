  <text x="72.0" y="204.0" class="sans" font-size="15" font-weight="600" letter-spacing="1.6" fill="#1F1B16" fill-opacity="0.6">AGENT-DRIVEN</text>
  <text x="72.0" y="236.0" class="serif" font-size="24" fill="#1F1B16">Coding agent in the app directory</text>
  <text x="72.0" y="264.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.75">Claude Code, Codex · edits in place, then node .pneuma/pneuma.mjs submit</text>
  <text x="960.0" y="204.0" class="sans" font-size="15" font-weight="600" letter-spacing="1.6" fill="#1F1B16" fill-opacity="0.6">HOST-DRIVEN</text>
  <text x="960.0" y="236.0" class="serif" font-size="24" fill="#1F1B16">Agent product that starts the agent</text>
  <text x="960.0" y="264.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.75">bun run drive change starts the agent on a draft</text>
