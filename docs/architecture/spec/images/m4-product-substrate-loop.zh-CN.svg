<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="608" viewBox="0 0 1088 608" role="img" aria-labelledby="title desc">
  <title id="title">M4 产品 substrate 闭环</title>
  <desc id="desc">Knowledge Inbox 把产品形态的 capture 和 triage workflow 连接到 Operation API、SQLite 持久化、Docker restart 和 live primitive inspection。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#1f1b16" stroke-width="1.4"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#b8732a" stroke-width="1.6"/></marker>
    <style>
      .paper { fill: #f4efe3; } .ink { fill: #1f1b16; } .muted { fill: #625a4e; }
      .hair { stroke: #1f1b16; stroke-width: 1.35; fill: none; } .amber-line { stroke: #b8732a; stroke-width: 1.8; fill: none; }
      .box { fill: #fcf8ee; stroke: #1f1b16; stroke-width: 1.3; rx: 14; }
      .sage { fill: #dfe9d7; stroke: #6f8063; stroke-width: 1.3; rx: 14; }
      .amber { fill: #f2d7ac; stroke: #b8732a; stroke-width: 1.3; rx: 14; }
      .blue { fill: #dde9eb; stroke: #657f88; stroke-width: 1.3; rx: 14; }
      .serif { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-weight: 400; }
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .title { font-size: 48px; letter-spacing: 0; } .label { font-size: 18px; font-weight: 700; } .small { font-size: 14px; }
    </style>
  </defs>
  <rect class="paper" width="1088" height="608"/>
  <path d="M44 136 H608" class="hair" opacity=".65"/>
  <text x="44" y="68" class="serif title ink">真实 App，</text>
  <text x="44" y="119" class="serif title ink">同一套 primitive substrate。</text>
  <text x="650" y="68" class="sans small muted">M4 把 substrate 变成一个小而真实的 app：</text>
  <text x="650" y="92" class="sans small muted">capture、triage、查看存储 rows、restart，</text>
  <text x="650" y="116" class="sans small muted">并实时解释 framework surface。</text>

  <rect x="52" y="178" width="190" height="112" class="box"/>
  <text x="78" y="214" class="sans label ink">Viewer App</text>
  <text x="78" y="244" class="sans small muted">capture form</text>
  <text x="78" y="266" class="sans small muted">review queue</text>

  <rect x="284" y="178" width="210" height="112" class="amber"/>
  <text x="312" y="214" class="sans label ink">Operation API</text>
  <text x="312" y="244" class="mono small muted">capture_item</text>
  <text x="312" y="266" class="mono small muted">update_item_status</text>

  <rect x="546" y="178" width="220" height="112" class="blue"/>
  <text x="574" y="214" class="sans label ink">SQLite app.db</text>
  <text x="574" y="244" class="mono small muted">inbox_items</text>
  <text x="574" y="266" class="sans small muted">真实 app rows</text>

  <rect x="818" y="178" width="218" height="112" class="sage"/>
  <text x="846" y="214" class="sans label ink">Data View</text>
  <text x="846" y="244" class="sans small muted">可见存储 rows</text>
  <text x="846" y="266" class="sans small muted">同一个 source of truth</text>

  <path d="M242 234 H276" class="hair" marker-end="url(#arrow)"/>
  <path d="M494 234 H538" class="hair" marker-end="url(#arrow)"/>
  <path d="M766 234 H810" class="amber-line" marker-end="url(#arrow-amber)"/>

  <rect x="122" y="366" width="236" height="118" class="sage"/>
  <text x="150" y="404" class="sans label ink">Demo Runner</text>
  <text x="150" y="434" class="mono small muted">run.ts --seed</text>
  <text x="150" y="458" class="sans small muted">确定性 demo rows</text>

  <rect x="426" y="366" width="236" height="118" class="amber"/>
  <text x="454" y="404" class="sans label ink">Docker Restart</text>
  <text x="454" y="434" class="sans small muted">mounted volume</text>
  <text x="454" y="458" class="sans small muted">status 保留下来</text>

  <rect x="730" y="366" width="236" height="118" class="blue"/>
  <text x="758" y="404" class="sans label ink">Live Substrate</text>
  <text x="758" y="434" class="sans small muted">schema / service / API</text>
  <text x="758" y="458" class="mono small muted">/api/config</text>

  <path d="M927 290 C927 326 848 328 848 358" class="hair" opacity=".75" marker-end="url(#arrow)"/>
  <path d="M358 424 H418" class="amber-line" marker-end="url(#arrow-amber)"/>
  <path d="M662 424 H722" class="hair" marker-end="url(#arrow)"/>
  <path d="M240 366 C240 328 147 326 147 298" class="hair" opacity=".75" marker-end="url(#arrow)"/>

  <rect x="326" y="520" width="436" height="46" fill="#fcf8ee" stroke="#b8732a" stroke-width="1.2" rx="23"/>
  <text x="368" y="549" class="sans small ink">成功句：真实 reference app 跑在 Pneuma primitives 上。</text>
</svg>
