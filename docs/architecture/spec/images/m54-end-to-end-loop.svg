<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">M54 end-to-end governed loop</title>
  <desc id="desc">One governed loop, from an intent to going back In the governed modes there is no change without an approval record; every attempt is recorded with the guarantees that held.</desc>
  <defs>
    <style>
      .serif { font-family: 'Iowan Old Style', 'Palatino', Georgia, serif; }
      .sans { font-family: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#1F1B16" stroke-width="1.3"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#B8732A" stroke-width="1.4"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="1600.0" height="900.0" fill="#F4EFE3"/>
  <text x="72.0" y="98.0" class="serif" font-size="42" fill="#1F1B16">One governed loop, from an intent to going back</text>
  <text x="72.0" y="138.0" class="sans" font-size="19" fill="#1F1B16" fill-opacity="0.72">In the governed modes there is no change without an approval record; every attempt is recorded with the guarantees that held.</text>
  <line x1="72.0" y1="166.0" x2="1528.0" y2="166.0" stroke="#1F1B16" stroke-width="0.8" stroke-opacity="0.35" />
  <line x1="72.0" y1="846.0" x2="1528.0" y2="846.0" stroke="#1F1B16" stroke-width="0.8" stroke-opacity="0.35" />
  <text x="72.0" y="876.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.6">Pneuma · Milestone 54 snapshot · 2026-11-24</text>
  <text x="1528.0" y="876.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.75" text-anchor="end">the owner decides</text>
  <circle cx="1385.2" cy="871.0" r="5.5" fill="#B8732A"/>
  <text x="72.0" y="234.0" class="sans" font-size="15" font-weight="600" letter-spacing="1.6" fill="#1F1B16" fill-opacity="0.6">INTENT</text>
  <text x="72.0" y="270.0" class="serif" font-size="22" font-style="italic" fill="#1F1B16">“add a search box”</text>
  <line x1="250.3" y1="262.0" x2="337.0" y2="262.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="383.0" y1="262.0" x2="627.0" y2="262.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="673.0" y1="262.0" x2="917.0" y2="262.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="963.0" y1="262.0" x2="1207.0" y2="262.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 1253 262 L 1360 262 A 152.0 152.0 0 0 1 1360 566 L 1253 566" fill="none" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="917.0" y1="566.0" x2="673.0" y2="566.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="627.0" y1="566.0" x2="383.0" y2="566.0" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 1208 566 C 1158 566, 1155.5 526, 1085.5 526 S 1003 566, 963 566" fill="none" stroke="#1F1B16" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 1208 566 C 1158 566, 1155.5 606, 1085.5 606 S 1003 566, 963 566" fill="none" stroke="#B8732A" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="1085.5" y="516.0" class="sans" font-size="15" font-weight="500" fill="#1F1B16" fill-opacity="0.75" text-anchor="middle">policy:auto</text>
  <path d="M 1085.5 598 L 1093.5 606 L 1085.5 614 L 1077.5 606 Z" fill="#B8732A" stroke="#B8732A" stroke-width="1.6" />
  <text x="1085.5" y="590.0" class="sans" font-size="16" font-weight="600" fill="#B8732A" text-anchor="middle">owner</text>
  <line x1="940.0" y1="240.0" x2="940.0" y2="200.0" stroke="#1F1B16" stroke-width="1" />
  <line x1="935.0" y1="195.0" x2="945.0" y2="205.0" stroke="#1F1B16" stroke-width="1.3" />
  <line x1="935.0" y1="205.0" x2="945.0" y2="195.0" stroke="#1F1B16" stroke-width="1.3" />
  <text x="956.0" y="204.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.75">Outside the writable roots, or a protected path:</text>
  <text x="956.0" y="224.0" class="sans" font-size="15" fill="#1F1B16" fill-opacity="0.75">rejected, nothing released</text>
  <path d="M 360 543 C 360 484, 650 484, 650 542" fill="none" stroke="#1F1B16" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="505.0" y="474.0" class="sans" font-size="15" font-style="italic" fill="#1F1B16" fill-opacity="0.7" text-anchor="middle">plan → refusals → older code out → data back → probe → record moves</text>
  <circle cx="360.0" cy="262.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="360.0" y="268.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">1</text>
  <text x="360.0" y="318.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">Edit in place</text>
  <text x="360.0" y="346.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">The agent edits</text>
  <text x="360.0" y="368.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">apps/&lt;name&gt;/ in place.</text>
  <text x="360.0" y="390.0" class="sans" font-size="16" font-style="italic" fill="#1F1B16" fill-opacity="0.62" text-anchor="middle">Host-driven: drive change</text>
  <text x="360.0" y="412.0" class="sans" font-size="16" font-style="italic" fill="#1F1B16" fill-opacity="0.62" text-anchor="middle">runs the agent on a draft.</text>
  <circle cx="650.0" cy="262.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="650.0" y="268.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">2</text>
  <text x="650.0" y="318.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">Submit</text>
  <text x="650.0" y="346.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">The Host copies the tree and diffs</text>
  <text x="650.0" y="368.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">it against what the address serves.</text>
  <circle cx="940.0" cy="262.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="940.0" y="268.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">3</text>
  <text x="940.0" y="318.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">Checks</text>
  <text x="940.0" y="346.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">Writable roots · protected paths ·</text>
  <text x="940.0" y="368.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">npm test, in a copy outside the</text>
  <text x="940.0" y="390.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">app; the draft is sealed by hash.</text>
  <circle cx="1230.0" cy="262.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="1230.0" y="268.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">4</text>
  <text x="1230.0" y="318.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">Preview</text>
  <text x="1230.0" y="346.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">An ephemeral app &lt;app&gt;-pv…</text>
  <text x="1230.0" y="368.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">with its own empty stores; it</text>
  <text x="1230.0" y="390.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">ends itself (default 3600 s).</text>
  <circle cx="1230.0" cy="566.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="1230.0" y="572.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">5</text>
  <text x="1230.0" y="622.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">The preset decides</text>
  <text x="1230.0" y="650.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">policy:auto approves</text>
  <text x="1230.0" y="672.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">ordinary changes;</text>
  <text x="1230.0" y="694.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">the owner decides risky ones,</text>
  <text x="1230.0" y="716.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">on the page or in a terminal.</text>
  <text x="1230.0" y="738.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">One-way: a second</text>
  <text x="1230.0" y="760.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">confirmation about stored data.</text>
  <circle cx="940.0" cy="566.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="940.0" y="572.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">6</text>
  <text x="940.0" y="622.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">Release</text>
  <text x="940.0" y="650.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">On PneumaSpace as a managed</text>
  <text x="940.0" y="672.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">app; the address is probed.</text>
  <text x="940.0" y="694.0" class="sans" font-size="16" font-style="italic" fill="#1F1B16" fill-opacity="0.62" text-anchor="middle">One-way with a capability declared:</text>
  <text x="940.0" y="716.0" class="sans" font-size="16" font-style="italic" fill="#1F1B16" fill-opacity="0.62" text-anchor="middle">the data snapshot is taken first.</text>
  <circle cx="650.0" cy="566.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="650.0" y="572.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">7</text>
  <text x="650.0" y="622.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">Record entry</text>
  <text x="650.0" y="650.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">vN, intent, agent, one-way mark,</text>
  <text x="650.0" y="672.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">and the guarantees that held:</text>
  <text x="650.0" y="694.0" class="sans" font-size="16" font-weight="500" fill="#1F1B16" text-anchor="middle">verified · previewed ·</text>
  <text x="650.0" y="716.0" class="sans" font-size="16" font-weight="500" fill="#1F1B16" text-anchor="middle">approved · sealed</text>
  <circle cx="360.0" cy="566.0" r="20" fill="#F4EFE3" stroke="#1F1B16" stroke-width="1.3"/>
  <text x="360.0" y="572.0" class="serif" font-size="18" fill="#1F1B16" text-anchor="middle">8</text>
  <text x="360.0" y="622.0" class="serif" font-size="22" fill="#1F1B16" text-anchor="middle">Undo</text>
  <text x="360.0" y="654.0" class="sans" font-size="16" font-weight="600" fill="#1F1B16" text-anchor="middle">Code</text>
  <text x="360.0" y="676.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">always</text>
  <text x="360.0" y="702.0" class="sans" font-size="16" font-weight="600" fill="#1F1B16" text-anchor="middle">Stored data</text>
  <text x="360.0" y="724.0" class="sans" font-size="16" fill="#1F1B16" fill-opacity="0.78" text-anchor="middle">only through a declared capability</text>
  <text x="360.0" y="750.0" class="sans" font-size="16" font-weight="600" fill="#B8732A" text-anchor="middle">Past a one-way change</text>
  <text x="360.0" y="772.0" class="sans" font-size="16" fill="#B8732A" text-anchor="middle">only with the owner’s confirmation</text>
</svg>
