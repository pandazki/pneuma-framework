<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">M5 证据矩阵</title>
  <desc id="desc">M5 Builder evolution 在测试、浏览器 e2e、文档上的证据覆盖。</desc>
  <defs>
    <style>
      .bg { fill: #f7f3ec; }
      .panel { fill: #fbf8f2; stroke: #d5cabe; stroke-width: 1.2; rx: 8; }
      .head { fill: #eee8dd; }
      .ink { fill: #3b3329; }
      .muted { fill: #7c7266; }
      .line { stroke: #d5cabe; stroke-width: 1; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h2 { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="640"/>
  <text x="48" y="72" class="title ink">M5 证据矩阵</text>
  <text x="48" y="104" class="body muted">M5 只在有确定性测试、浏览器检查或长期文档证据的 claim 上闭合。</text>

  <rect x="48" y="140" width="1024" height="400" class="panel"/>
  <rect x="48" y="140" width="1024" height="54" class="head"/>

  <text x="72" y="174" class="h2 ink">Claim</text>
  <text x="370" y="174" class="h2 ink">自动化证明</text>
