  <line x1="340" y1="140" x2="340" y2="540" class="line"/>
  <line x1="612" y1="140" x2="612" y2="540" class="line"/>
  <line x1="820" y1="140" x2="820" y2="540" class="line"/>
  <line x1="48" y1="194" x2="1072" y2="194" class="line"/>
  <line x1="48" y1="248" x2="1072" y2="248" class="line"/>
  <line x1="48" y1="302" x2="1072" y2="302" class="line"/>
  <line x1="48" y1="356" x2="1072" y2="356" class="line"/>
  <line x1="48" y1="410" x2="1072" y2="410" class="line"/>
  <line x1="48" y1="464" x2="1072" y2="464" class="line"/>

  <text x="72" y="226" class="body ink">Priority capability plan</text>
  <text x="370" y="226" class="mono muted">evolve.test</text>
  <text x="642" y="226" class="body muted">可见 Agent proposal</text>
  <text x="850" y="226" class="body muted">design + snapshot</text>

  <text x="72" y="280" class="body ink">受治理的 apply sequence</text>
  <text x="370" y="280" class="mono muted">4 次 definition.apply</text>
  <text x="642" y="280" class="body muted">governance rail</text>
  <text x="850" y="280" class="body muted">authorization evidence</text>

